name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Decode Release Keystore (if configured)
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "Release keystore decoded."
          else
            echo "RELEASE_KEYSTORE_BASE64 not set; build will fall back to the debug signing config."
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Android Release and Debug APKs
        run: |
          cd android
          ./gradlew assembleRelease assembleDebug \
            -PSUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            -PSUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
            -PAPI_BASE_URL="${{ secrets.API_BASE_URL || 'https://sportsdss.vercel.app/' }}" \
            -PRELEASE_KEYSTORE_FILE="release.keystore" \
            -PRELEASE_KEYSTORE_PASSWORD="${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.RELEASE_KEY_ALIAS || 'dss-sports' }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.RELEASE_KEY_PASSWORD }}"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Create Git Release Tag
        id: tag
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ScoreBoard Release ${{ steps.tag.outputs.tag_name }}
          body: |
            Automated Android APK build release for commit `${{ github.sha }}`.
            Min SDK: 24 (Android 7+)
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
