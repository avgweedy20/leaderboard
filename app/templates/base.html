<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DSS Sports — Inter-House Sports Meet{% endblock %}</title>
    <meta name="description" content="{% block meta_desc %}DSS Inter-House Sports Meet 2083 — live fixtures, standings, and scores for Futsal, Basketball, and Cricksal.{% endblock %}">


    <script>
      (function() {
        var t = localStorage.getItem('sb_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>


    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: ['attribute', '[data-theme="dark"]'],
        theme: { extend: {} },
        corePlugins: { preflight: false }
      }
    </script>

    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>
<body>


    <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M6 3h12v6a6 6 0 0 1-12 0V3z"/>
        <path d="M6 6H3a2 2 0 0 0-2 2v1a3 3 0 0 0 3 3h2M18 6h3a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-2M12 15v4M8 21h8"/>
      </symbol>
      <symbol id="icon-football" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7l3.5 2.5v4L12 16l-3.5-2.5v-4z"/>
        <path d="M12 3v4M20.5 9.5l-3.5 2M17.5 19.5l-2-3.5M6.5 19.5l2-3.5M3.5 9.5l3.5 2"/>
      </symbol>
      <symbol id="icon-basketball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3v18M5 5c3.5 3.5 3.5 10.5 0 14M19 5c-3.5 3.5-3.5 10.5 0 14"/>
      </symbol>
      <symbol id="icon-cricket" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M3 21l12-12M9 3l12 12M15 9l-6 6"/>
        <circle cx="19" cy="19" r="2"/>
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <rect x="3" y="4" width="18" height="17" rx="1"/>
        <path d="M16 2v4M8 2v4M3 9h18"/>
      </symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </symbol>
      <symbol id="icon-login" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M15 3h4v18h-4M10 17l5-5-5-5M15 12H3"/>
      </symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"/>
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </symbol>
      <symbol id="icon-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="14" rx="2"/>
        <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
        <line x1="12" y1="11" x2="12" y2="15"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="16" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12.01" y2="8"/>
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </symbol>
    </svg>


    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>


    <header class="navbar">
        <div class="brand">
            <svg class="icon" style="color: var(--text-primary);" width="18" height="18">
                <use href="#icon-trophy"/>
            </svg>
            <a href="/" class="brand-name">DSS Inter-House Sports Meet</a>
            <span id="dbModeBadge" class="badge badge-status-scheduled" style="margin-left: 4px;">
                Connecting...
            </span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
            <button id="themeToggleBtn" class="btn btn-secondary btn-icon" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
                <svg id="themeIcon" class="icon" width="14" height="14"><use href="#icon-moon"/></svg>
            </button>
            <button id="authBtn" class="btn" onclick="openLoginModal()">
                <svg id="authIcon" class="icon" width="14" height="14"><use href="#icon-login"/></svg>
                <span id="authBtnText">Admin Login</span>
            </button>
            <button id="navToggleBtn" class="btn btn-secondary btn-icon nav-toggle" onclick="toggleMobileNav()" aria-label="Open menu" aria-expanded="false" aria-controls="mobileNav">
                <svg class="icon" width="18" height="18"><use href="#icon-menu"/></svg>
            </button>
        </div>
    </header>


    <main class="page-container">


        <nav class="tab-bar" aria-label="Page navigation">
            <a href="/" class="tab-btn {% if active_page == 'overall' %}active{% endif %}">
                <svg class="icon" width="14" height="14"><use href="#icon-trophy"/></svg>
                Overall Standings
            </a>
            <a href="/fixtures" class="tab-btn {% if active_page == 'fixtures' %}active{% endif %}">
                <svg class="icon" width="14" height="14"><use href="#icon-calendar"/></svg>
                Fixtures
            </a>
            <a href="/standings/futsal" class="tab-btn {% if active_page == 'standings' %}active{% endif %}">
                <svg class="icon" width="14" height="14"><use href="#icon-football"/></svg>
                Per-Sport Standings
            </a>
            <a id="adminTabBtn" href="/admin" class="tab-btn {% if active_page and active_page.startswith('admin') %}active{% endif %}" style="display:none;">
                <svg class="icon" width="14" height="14"><use href="#icon-shield"/></svg>
                Admin
            </a>
        </nav>

        {% block content %}{% endblock %}
    </main>


    <footer class="site-footer">
        <span class="footer-type" id="footerType" aria-live="polite"></span><span class="type-caret" aria-hidden="true"></span>
    </footer>


    <div id="mobileNav" class="mobile-nav hidden" aria-hidden="true">
        <a href="/" class="mobile-nav-link {% if active_page == 'overall' %}active{% endif %}">
            <svg class="icon" width="14" height="14"><use href="#icon-trophy"/></svg>
            Overall Standings
        </a>
        <a href="/fixtures" class="mobile-nav-link {% if active_page == 'fixtures' %}active{% endif %}">
            <svg class="icon" width="14" height="14"><use href="#icon-calendar"/></svg>
            Fixtures
        </a>
        <a href="/standings/futsal" class="mobile-nav-link {% if active_page == 'standings' %}active{% endif %}">
            <svg class="icon" width="14" height="14"><use href="#icon-football"/></svg>
            Per-Sport Standings
        </a>
        <a id="mobileAdminLink" href="/admin" class="mobile-nav-link {% if active_page and active_page.startswith('admin') %}active{% endif %}" style="display:none;">
            <svg class="icon" width="14" height="14"><use href="#icon-shield"/></svg>
            Admin Control
        </a>
    </div>


    <div id="loginModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Admin Sign In</h3>
                <button class="modal-close" onclick="closeModal('loginModal')" aria-label="Close">&times;</button>
            </div>
            <form onsubmit="handleLogin(event)" autocomplete="off" style="display:flex; flex-direction:column; gap:16px;">
                <div>
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required placeholder="admin@scoreboard.com"
                           autocomplete="off" style="width:100%;">
                </div>
                <div>
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Password"
                           autocomplete="new-password" style="width:100%;">
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('loginModal')">Cancel</button>
                    <button type="submit" class="btn">Sign In</button>
                </div>
            </form>
        </div>
    </div>


    <div id="matchModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Record Match Score</h3>
                <button class="modal-close" onclick="closeModal('matchModal')" aria-label="Close">&times;</button>
            </div>
            <form onsubmit="handleMatchSubmit(event)" autocomplete="off" style="display:flex; flex-direction:column; gap:16px;">
                <input type="hidden" id="matchId">
                <p id="matchModalSummary" style="font-size:13px; font-weight:700; color:var(--text-primary); text-align:center;">Team A vs Team B</p>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div>
                        <label id="teamALabel">Team A Score</label>
                        <input type="number" id="matchScoreA" required min="0"
                               style="width:100%; text-align:center; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; height:48px;">
                    </div>
                    <div>
                        <label id="teamBLabel">Team B Score</label>
                        <input type="number" id="matchScoreB" required min="0"
                               style="width:100%; text-align:center; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; height:48px;">
                    </div>
                </div>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('matchModal')">Cancel</button>
                    <button type="submit" class="btn">Save Result</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
