<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DSS Sports - Inter-House Sports Meet{% endblock %}</title>
    <!-- Inline FOUC Prevention for Theme Persistence -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('sb_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              karnali: '#10B981',
              koshi: '#0EA5E9',
              mahakali: '#8B5CF6',
              mechi: '#F97316'
            }
          }
        }
      }
    </script>
    <!-- GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen font-sans antialiased relative selection:bg-emerald-500 selection:text-white">

    <!-- ANIMATED BACKGROUND LAYER (No gradients in components) -->
    <div id="beamBackground" class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-20">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl animate-pulse"></div>
        <div class="absolute top-1/3 -right-40 w-96 h-96 bg-sky-500/10 rounded-full blur-3xl animate-pulse delay-1000"></div>
    </div>

    <!-- SVG SPRITE DEFINITIONS -->
    <svg style="display: none;" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-stopwatch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4l3 3M12 5V3M10 3h4M19 7l1-1"/>
      </symbol>
      <symbol id="icon-football" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7l3.5 2.5v4L12 16l-3.5-2.5v-4z"/>
        <path d="M12 3v4M20.5 9.5l-3.5 2M17.5 19.5l-2-3.5M6.5 19.5l2-3.5M3.5 9.5l3.5 2"/>
      </symbol>
      <symbol id="icon-basketball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3v18M5 5c3.5 3.5 3.5 10.5 0 14M19 5c-3.5 3.5-3.5 10.5 0 14"/>
      </symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M6 3h12v6a6 6 0 0 1-12 0V3z"/>
        <path d="M6 6H3a2 2 0 0 0-2 2v1a3 3 0 0 0 3 3h2M18 6h3a2 2 0 0 1 2 2v1a3 3 0 0 1-3 3h-2M12 15v4M8 21h8"/>
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <rect x="3" y="4" width="18" height="17" rx="1"/>
        <path d="M16 2v4M8 2v4M3 9h18"/>
      </symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M12 2L4 5v6c0 5.5 3.8 10.7 8 12 4.2-1.3 8-6.5 8-12V5l-8-3z"/>
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </symbol>
      <symbol id="icon-login" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M15 3h4v18h-4M10 17l5-5-5-5M15 12H3"/>
      </symbol>
      <symbol id="icon-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>
      </symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
        <path d="M23 4v6h-6M1 20v-6h6"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </symbol>
      <symbol id="icon-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
        <circle cx="12" cy="13" r="8"/>
        <path d="M12 9v4M12 5V3M10 3h4M8 17h8"/>
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="17 8 12 3 7 8"></polyline>
        <line x1="12" y1="3" x2="12" y2="15"></line>
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </symbol>
    </svg>

    <!-- HEADER NAVBAR -->
    <header class="navbar relative z-10">
        <div class="brand flex items-center gap-3">
            <svg class="icon text-emerald-400 w-6 h-6"><use href="#icon-trophy"></use></svg>
            <a href="/" class="font-black tracking-wide text-lg text-white hover:text-emerald-400 transition">DSS Inter-House Sports Meet</a>
            <span id="dbModeBadge" class="status-pill text-xs px-2.5 py-1 rounded-full font-mono border border-emerald-500/30 bg-emerald-500/10 text-emerald-400">
                Connected: Postgres DB [DEBUG]
            </span>
        </div>
        <div class="nav-actions flex items-center gap-3">
            <button id="themeToggleBtn" class="btn btn-secondary flex items-center gap-2 px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 transition" onclick="toggleTheme()" title="Toggle Theme">
                <svg id="themeIcon" class="icon w-4 h-4"><use href="#icon-moon"></use></svg>
                <span id="themeText" class="text-xs font-medium">Dark Mode</span>
            </button>

            <button id="authBtn" class="btn btn-primary flex items-center gap-2 px-4 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 font-semibold text-xs tracking-wide transition shadow-lg shadow-emerald-900/30" onclick="openLoginModal()">
                <svg id="authIcon" class="icon w-4 h-4"><use href="#icon-login"></use></svg>
                <span id="authBtnText">Admin Login</span>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER WITH HEADER PAGE NAV -->
    <main class="container relative z-10 max-w-7xl mx-auto px-4 py-6">

        <!-- HEADER PAGE NAVIGATION (REAL LINKS) -->
        <nav class="tab-bar mb-8 flex border-b border-slate-800 gap-2">
            <a href="/" class="tab-btn font-semibold text-sm px-4 py-2.5 flex items-center border-b-2 {% if active_page == 'overall' %}border-emerald-400 text-emerald-400 active{% else %}border-transparent text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="icon w-4 h-4 mr-2"><use href="#icon-trophy"></use></svg>
                Overall House Standings
            </a>
            <a href="/standings/futsal" class="tab-btn font-semibold text-sm px-4 py-2.5 flex items-center border-b-2 {% if active_page == 'standings' %}border-emerald-400 text-emerald-400 active{% else %}border-transparent text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="icon w-4 h-4 mr-2"><use href="#icon-football"></use></svg>
                Per-Sport Standings
            </a>
            <a href="/fixtures" class="tab-btn font-semibold text-sm px-4 py-2.5 flex items-center border-b-2 {% if active_page == 'fixtures' %}border-emerald-400 text-emerald-400 active{% else %}border-transparent text-slate-400 hover:text-slate-200{% endif %}">
                <svg class="icon w-4 h-4 mr-2"><use href="#icon-calendar"></use></svg>
                Tie-Sheet & Fixtures
            </a>
            <a id="adminTabBtn" href="/admin" class="tab-btn font-semibold text-sm px-4 py-2.5 flex items-center border-b-2 {% if active_page and active_page.startswith('admin') %}border-emerald-400 text-emerald-400 active{% else %}border-transparent text-slate-400 hover:text-slate-200{% endif %}" style="display: none;">
                <svg class="icon w-4 h-4 mr-2"><use href="#icon-shield"></use></svg>
                Admin Control
            </a>
        </nav>

        {% block content %}{% endblock %}

    </main>

    <!-- SHARED MODALS -->
    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="modal-content bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 shadow-2xl relative">
            <div class="modal-header flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">Admin Sign In</h3>
                <button class="close-btn text-slate-400 hover:text-white text-xl font-bold" aria-label="Close modal" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <form onsubmit="handleLogin(event)" autocomplete="off" class="space-y-4">
                <div class="form-group">
                    <label for="loginEmail" class="block text-xs font-semibold text-slate-400 mb-1">Email</label>
                    <input type="email" id="loginEmail" required placeholder="admin@scoreboard.com" autocomplete="off" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="form-group">
                    <label for="loginPassword" class="block text-xs font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="new-password" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" class="btn btn-secondary px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg transition" onclick="closeModal('loginModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow transition">Sign In</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MATCH SCORE MODAL -->
    <div id="matchModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
        <div class="modal-content bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 shadow-2xl relative">
            <div class="modal-header flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">Record Match Score</h3>
                <button class="close-btn text-slate-400 hover:text-white text-xl font-bold" onclick="closeModal('matchModal')">&times;</button>
            </div>
            <form onsubmit="handleMatchSubmit(event)" autocomplete="off" class="space-y-4">
                <input type="hidden" id="matchId">
                <div class="text-center font-bold text-slate-300 text-sm mb-2" id="matchModalSummary">Team A vs Team B</div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label id="teamALabel" class="block text-xs font-semibold text-slate-400 mb-1">Team A Score</label>
                        <input type="number" id="matchScoreA" required min="0" class="w-full bg-slate-800 border border-slate-700 text-white text-center text-xl font-bold rounded-lg py-2 focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                    <div>
                        <label id="teamBLabel" class="block text-xs font-semibold text-slate-400 mb-1">Team B Score</label>
                        <input type="number" id="matchScoreB" required min="0" class="w-full bg-slate-800 border border-slate-700 text-white text-center text-xl font-bold rounded-lg py-2 focus:ring-2 focus:ring-purple-500 outline-none">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" class="btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg" onclick="closeModal('matchModal')">Cancel</button>
                    <button type="submit" class="btn px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-lg shadow">Save Match Result</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
