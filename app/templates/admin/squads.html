{% extends "base.html" %}

{% block title %}House Squads - Admin Control - DSS Sports{% endblock %}

{% block content %}
<section id="adminSquadsPage" class="space-y-6">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-3xl font-extrabold text-white mb-1">House Squad Roster</h1>
            <p class="text-slate-400 text-sm">Manage house squads across sports and gender divisions.</p>
        </div>
        <button onclick="openSquadModal()" class="btn flex items-center gap-2 px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs rounded-lg shadow-md transition">
            <svg class="icon w-4 h-4"><use href="#icon-plus"></use></svg> Add Squad
        </button>
    </div>

    <!-- ADMIN SUB-NAV -->
    <div class="flex gap-4 border-b border-slate-800 pb-3 text-sm font-bold">
        <a href="/admin" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">Overview</a>
        <a href="/admin/squads" class="px-3 py-1.5 rounded-lg bg-slate-800 text-emerald-400">Squads</a>
        <a href="/admin/players" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">Players</a>
        <a href="/admin/seeder-log" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">Seeder Log</a>
    </div>

    <div class="card bg-slate-900/90 border border-slate-800 rounded-xl p-5 shadow-xl">
        <div id="adminSquadsList" class="table-responsive">
            <div class="p-3 space-y-2"><div class="skeleton-table-row"></div><div class="skeleton-table-row"></div></div>
        </div>
    </div>
</section>

<!-- SQUAD MODAL -->
<div id="squadModal" class="modal fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden">
    <div class="modal-content bg-slate-900 border border-slate-800 rounded-xl max-w-md w-full p-6 shadow-2xl relative">
        <div class="modal-header flex items-center justify-between mb-4 border-b border-slate-800 pb-3">
            <h3 id="squadModalTitle" class="text-lg font-bold text-white">Add House Squad</h3>
            <button class="close-btn text-slate-400 hover:text-white text-xl font-bold" onclick="closeModal('squadModal')">&times;</button>
        </div>
        <form onsubmit="handleSquadSubmit(event)" autocomplete="off" class="space-y-4">
            <input type="hidden" id="squadId">
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">House</label>
                <select id="squadHouseId" required class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm outline-none"></select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Sport</label>
                <select id="squadSportId" required class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm outline-none"></select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Gender</label>
                <select id="squadGender" required class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm outline-none">
                    <option value="Boys">Boys</option>
                    <option value="Girls">Girls</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Squad Label (A/B)</label>
                <input type="text" id="squadLabel" required placeholder="A" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg px-3 py-2 text-sm outline-none">
            </div>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" class="btn px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg" onclick="closeModal('squadModal')">Cancel</button>
                <button type="submit" class="btn px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg">Save Squad</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await fetchHouses();
        await fetchSports();
        await fetchSquads();
        renderAdminSquadsTable();
    });
</script>
{% endblock %}
