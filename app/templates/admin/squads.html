{% extends "base.html" %}

{% block title %}House Squads/ Teams{% endblock %}

{% block content %}
<section>

    <div
        style="display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid var(--border);">
        <div>
            <h1>House Squad Roster</h1>
            <p style="margin-top:6px; font-size:14px;">Manage house squads across sports and gender divisions.</p>
        </div>
        <button onclick="openSquadModal()" class="btn">
            <svg class="icon" width="14" height="14">
                <use href="#icon-plus" />
            </svg>
            Add Squad
        </button>
    </div>


    <div style="display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:28px;">
        <a href="/admin" class="tab-btn {% if active_admin_sub == 'dashboard' %}active{% endif %}">Overview</a>
        <a href="/admin/squads" class="tab-btn {% if active_admin_sub == 'squads' %}active{% endif %}">Squads</a>
        <a href="/admin/players" class="tab-btn {% if active_admin_sub == 'players' %}active{% endif %}">Players</a>
    </div>

    <div class="admin-section">
        <div class="admin-section-header">
            <div style="display:flex; align-items:center; gap:8px;">
                <div class="dot-indicator" style="background-color:var(--c-karnali);"></div>
                <h3 style="margin:0;">All Registered Squads</h3>
            </div>
            <span id="squadCountBadge" class="badge badge-stage">0 Squads</span>
        </div>
        <div id="adminSquadsList">
            <div class="skeleton-table sk" aria-hidden="true">
                <div class="skeleton-table-header">
                    <div class="sk-bar" style="height:12px; width:100px;"></div>
                    <div class="sk-bar" style="height:12px; width:80px;"></div>
                    <div class="sk-bar" style="height:12px; width:70px;"></div>
                    <div class="sk-bar" style="height:12px; width:60px; margin-left:auto;"></div>
                </div>
                <div class="skeleton-row">
                    <div class="sk-bar" style="height:12px; width:110px;"></div>
                    <div class="sk-bar" style="height:12px; width:70px;"></div>
                    <div class="sk-bar" style="height:12px; width:80px;"></div>
                    <div class="sk-bar" style="height:12px; width:50px; margin-left:auto;"></div>
                </div>
                <div class="skeleton-row">
                    <div class="sk-bar" style="height:12px; width:90px;"></div>
                    <div class="sk-bar" style="height:12px; width:75px;"></div>
                    <div class="sk-bar" style="height:12px; width:65px;"></div>
                    <div class="sk-bar" style="height:12px; width:50px; margin-left:auto;"></div>
                </div>
                <div class="skeleton-row">
                    <div class="sk-bar" style="height:12px; width:100px;"></div>
                    <div class="sk-bar" style="height:12px; width:70px;"></div>
                    <div class="sk-bar" style="height:12px; width:72px;"></div>
                    <div class="sk-bar" style="height:12px; width:50px; margin-left:auto;"></div>
                </div>
            </div>
        </div>
    </div>
</section>


<div id="squadModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="squadModalTitle">Add House Squad</h3>
            <button class="modal-close" onclick="closeModal('squadModal')">&times;</button>
        </div>
        <form onsubmit="handleSquadSubmit(event)" autocomplete="off"
            style="display:flex; flex-direction:column; gap:14px;">
            <input type="hidden" id="squadId">
            <div>
                <label>House</label>
                <select id="squadHouseId" required style="width:100%;"></select>
            </div>
            <div>
                <label>Sport</label>
                <select id="squadSportId" required style="width:100%;"></select>
            </div>
            <div>
                <label>Gender</label>
                <select id="squadGender" required style="width:100%;">
                    <option value="Boys">Boys</option>
                    <option value="Girls">Girls</option>
                </select>
            </div>
            <div>
                <label>Squad Label (A / B)</label>
                <input type="text" id="squadLabel" required placeholder="A" style="width:100%;">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
                <button type="button" class="btn btn-secondary" onclick="closeModal('squadModal')">Cancel</button>
                <button type="submit" class="btn">Save Squad</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await Promise.all([fetchHouses(), fetchSports(), fetchSquads()]);
        renderAdminSquadsTable();
    });
</script>
{% endblock %}
